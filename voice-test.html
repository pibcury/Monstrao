<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Voice input test</title>
<style>
  :root{color-scheme: dark;}
  body{
    margin:0; padding:24px 20px 60px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#0f1115; color:#e8eaed; min-height:100vh; box-sizing:border-box;
  }
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:#9aa0a6; font-size:14px; margin-bottom:24px;}
  .status{
    padding:14px 16px; border-radius:10px; font-size:14px; margin-bottom:20px;
    border:1.5px solid #333;
  }
  .status.ok{background:#0f2a1a; border-color:#2e7d4f; color:#8fe5ab;}
  .status.bad{background:#2a1414; border-color:#7d2e2e; color:#f0a0a0;}
  .status.idle{background:#1a1d24; border-color:#333;}
  button{
    width:100%; padding:18px; font-size:17px; font-weight:700; border-radius:14px;
    border:none; cursor:pointer; margin-bottom:16px;
  }
  #micBtn{background:linear-gradient(135deg,#4fd1e8,#8b7bf0); color:#0a0a0f;}
  #micBtn.listening{background:#e05252; color:#fff;}
  #micBtn:disabled{opacity:0.4; cursor:not-allowed;}
  textarea{
    width:100%; box-sizing:border-box; min-height:120px; font-size:15px; padding:14px;
    border-radius:10px; border:1.5px solid #333; background:#1a1d24; color:#e8eaed;
    font-family:inherit; resize:vertical;
  }
  .log{
    margin-top:20px; font-size:12px; color:#777; white-space:pre-wrap; word-break:break-word;
    background:#15171c; border-radius:8px; padding:12px; max-height:200px; overflow-y:auto;
  }
  label{font-size:13px; color:#9aa0a6; display:block; margin:16px 0 6px;}
</style>
</head>
<body>
  <h1>🎤 Voice input feasibility test</h1>
  <div class="sub">Just checking if your browser can turn speech into text. Nothing here is saved or sent anywhere.</div>

  <div id="status" class="status idle">Checking browser support…</div>

  <button id="micBtn" disabled>Tap to start speaking</button>

  <label>Transcribed text</label>
  <textarea id="output" placeholder="What you say will appear here…" readonly></textarea>

  <div class="log" id="log"></div>

<script>
  const statusEl = document.getElementById('status');
  const micBtn = document.getElementById('micBtn');
  const output = document.getElementById('output');
  const logEl = document.getElementById('log');

  function log(msg){
    const t = new Date().toLocaleTimeString();
    logEl.textContent += `[${t}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(text, cls){
    statusEl.textContent = text;
    statusEl.className = 'status ' + cls;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    setStatus('❌ Not supported on this browser. The SpeechRecognition API is not available here.', 'bad');
    log('window.SpeechRecognition and window.webkitSpeechRecognition are both undefined.');
    micBtn.textContent = 'Not available';
  } else {
    setStatus('✅ Speech recognition API is available. Tap the button and allow microphone access when asked.', 'ok');
    log('SpeechRecognition API detected.');
    micBtn.disabled = false;

    const recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';

    let listening = false;
    let finalText = '';

    recognition.onstart = () => {
      listening = true;
      micBtn.textContent = '● Listening… tap to stop';
      micBtn.classList.add('listening');
      setStatus('🎙️ Listening — speak now.', 'ok');
      log('recognition started');
    };

    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalText += transcript + ' ';
        } else {
          interim += transcript;
        }
      }
      output.value = (finalText + interim).trim();
    };

    recognition.onerror = (event) => {
      log('ERROR: ' + event.error);
      setStatus('⚠️ Error: ' + event.error + (event.error === 'not-allowed' ? ' (microphone permission denied — check Safari settings)' : ''), 'bad');
    };

    recognition.onend = () => {
      listening = false;
      micBtn.textContent = 'Tap to start speaking';
      micBtn.classList.remove('listening');
      log('recognition ended');
      if (!statusEl.classList.contains('bad')) {
        setStatus('✅ Stopped. Tap again to continue, or review the text below.', 'ok');
      }
    };

    micBtn.addEventListener('click', () => {
      if (listening) {
        recognition.stop();
      } else {
        finalText = output.value ? output.value + ' ' : '';
        try {
          recognition.start();
        } catch (e) {
          log('start() threw: ' + e.message);
        }
      }
    });
  }
</script>
</body>
</html>
